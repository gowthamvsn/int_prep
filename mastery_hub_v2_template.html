<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title><style>
:root{--bg:#0A0A0F;--panel:#13131A;--panel2:#1A1A22;--ink:#EAEAEB;--muted:#888890;--line:#2D2D36;--accent:#4A90E2;--accent-hi:#81B3E8;--accent-soft:#1A2C42;--code-bg:#16161D;--ok:#50E3C2;--bad:#F5A623;--warn:#F8E71C;--display:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol";--body:"Inter",sans-serif;--mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;margin:0;padding:1rem;}
.wrap{max-width:56rem;margin:0 auto;}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.3;text-wrap:balance;}
h1{font-size:2.5rem;letter-spacing:-.02em;margin-bottom:0.5rem;}
h2{font-size:1.75rem;margin:2.5rem 0 1rem;padding-bottom:0.5rem;border-bottom:1px solid var(--line);}
a{color:var(--accent-hi);text-decoration:none;} a:hover{text-decoration:underline;}
.lede{font-size:1.1rem;color:var(--muted);max-width:48rem;margin-bottom:2rem;}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:1rem;font-family:var(--mono);font-size:0.875rem;line-height:1.6;overflow-x:auto;position:relative;}
code{font-family:var(--mono);font-size:0.9em;background:var(--code-bg);border-radius:4px;padding:0.15em 0.4em;}
pre > code{background:transparent;padding:0;font-size:1em;}
.run-btn{position:absolute;top:0.5rem;right:0.5rem;background:var(--accent-soft);color:var(--accent-hi);border:1px solid var(--accent);border-radius:5px;font-family:var(--mono);font-size:0.7rem;padding:0.25rem 0.6rem;cursor:pointer;opacity:0.6;}
pre:hover .run-btn{opacity:1;}
.run-btn:hover{background:var(--accent);}
.output-box{background:var(--panel2);border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;margin-top:-1rem;margin-bottom:1rem;padding:0.75rem 1rem;font-family:var(--mono);font-size:0.8rem;white-space:pre-wrap;line-height:1.5;display:none;}
.output-box.error{color:var(--bad);}
.output-box.loading{color:var(--muted);}
.tier-block{margin:2.2rem 0}
.tier-block h2{margin-bottom:.15rem}
.tier-sub{color:var(--muted);font-family:var(--mono);font-size:.82rem;margin:0 0 .8rem}
.topic-card{background:var(--panel);border:1px solid var(--line);border-radius:.55rem;padding:1rem 1.1rem;margin:.9rem 0;transition:border-color .2s}
.topic-card:hover{border-color:var(--accent);}
.topic-card h3{margin:.1rem 0 .3rem}
.topic-card h3 a{color:inherit;text-decoration:none;}
.topic-card .blurb{color:var(--muted);margin:.2rem 0 .6rem;font-size:.9rem}
.role-badge{display:inline-block;font-family:var(--mono);font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-hi);border:1px solid var(--accent);border-radius:.3rem;padding:.1rem .45rem;margin-left:.5rem;vertical-align:middle}
.reference-block{background:var(--panel2);border:1px dashed var(--accent);border-radius:.6rem;padding:.2rem 1.1rem 1rem;margin-bottom:2.6rem}
.bonus-block{background:var(--panel2);border:1px dashed var(--ok);border-radius:.6rem;padding:.2rem 1.1rem 1rem;margin-bottom:2.6rem}
</style></head><body><div class="wrap">{{BODY}}</div>
<script>
(function(){
"use strict";

function initWhyEngine() {
    document.querySelectorAll("pre").forEach(pre => {
        const code = pre.querySelector("code");
        if (!code) return;

        // 1. Add "Run" button to code blocks
        const btn = document.createElement("button");
        btn.className = "run-btn";
        btn.textContent = "▶ Run";
        btn.title = "Execute this code block";
        pre.appendChild(btn);

        const outputBox = document.createElement("div");
        outputBox.className = "output-box";
        pre.insertAdjacentElement("afterend", outputBox);

        btn.addEventListener("click", async () => {
            outputBox.style.display = "block";
            outputBox.textContent = "Executing...";
            outputBox.classList.remove("error");
            outputBox.classList.add("loading");

            try {
                const res = await fetch("/api/execute_code", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ code: code.textContent })
                });
                const data = await res.json();
                
                outputBox.classList.remove("loading");
                if (data.error) {
                    outputBox.classList.add("error");
                    outputBox.textContent = data.error;
                } else {
                    outputBox.textContent = data.output || "(No output)";
                }
            } catch (e) {
                outputBox.classList.remove("loading");
                outputBox.classList.add("error");
                outputBox.textContent = "Failed to connect to the server. Is mastery_hub_v2.py running?";
            }
        });

        // 2. Add "Explain this line" functionality (placeholder)
        // This is more complex as it requires splitting code into lines
        // and handling clicks. A full implementation would use a library
        // like CodeMirror or Monaco, but for a simple version:
        const lines = code.innerHTML.split('\\n');
        const newLines = lines.map(line => {
            const span = document.createElement('span');
            span.className = 'code-line';
            span.textContent = line;
            span.title = "Click to ask about this line";
            span.style.cursor = 'help';
            return span.outerHTML;
        });
        // This simple version has issues with existing HTML in code.
        // A more robust solution is needed for production.
        // For now, we'll just log the concept.
        pre.addEventListener('click', (e) => {
            if (e.target.classList.contains('code-line')) {
                console.log("Socratic explain clicked for line:", e.target.textContent);
                // Here you would trigger the API call to /api/socratic_explain
            }
        });
    });
}


if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initWhyEngine);
} else {
    initWhyEngine();
}

})();
</script>
</body></html>
