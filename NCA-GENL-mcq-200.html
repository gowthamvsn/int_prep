{"d":"Data Analysis","q":"Exploratory Data Analysis (EDA) is best described as:","o":["An early step examining a dataset's structure, distributions, and anomalies before modeling decisions are made","A synonym for hyperparameter tuning","The final step after deployment to monitor drift","A synonym for A/B testing"],"a":[0],"e":"EDA happens before serious modeling -- summarizing distributions, spotting missing values/outliers, and checking relationships to inform later modeling choices."},
{"d":"Data Analysis","q":"Standardization (z-score scaling) transforms a feature to have:","o":["Mean 0 and standard deviation 1","Only positive integer values","Values strictly between 0 and 1","The same scale as the target variable"],"a":[0],"e":"Standardization subtracts the mean and divides by the standard deviation, centering the feature at 0 with unit variance."},
{"d":"Data Analysis","q":"Min-max normalization rescales a feature to:","o":["Always to integers","A Gaussian distribution","A fixed range, typically [0, 1]","Mean 0, standard deviation 1"],"a":[2],"e":"Min-max normalization linearly rescales values based on the observed min and max into a bounded range like [0,1] -- distinct from standardization's mean/std-based scaling."},
{"d":"Data Analysis","q":"When a dataset has missing values, a common EDA-stage strategy is to:","o":["Always delete every row with any missing value, regardless of how much data is lost","Replace all missing values with zero without further thought","Investigate the pattern of missingness first, then choose deletion or imputation appropriately based on how much and why data is missing","Ignore missing values -- models handle them automatically by default"],"a":[2],"e":"Blindly dropping rows or filling with zero can bias the dataset; understanding the missingness pattern informs whether deletion, imputation, or another approach is appropriate."},
{"d":"Data Analysis","q":"A word cloud sized by frequency is a quick way to:","o":["Compute BLEU or ROUGE scores","Get an at-a-glance sense of which terms appear most often in a body of text","Precisely rank documents by relevance for retrieval","Replace embeddings for semantic search"],"a":[1],"e":"Word clouds are a lightweight, approximate visualization of term frequency -- not a precise analytic tool."},
{"d":"Data Analysis","q":"Pick TWO valid reasons to prefer cuDF over pandas for a large tabular dataset.","o":["cuDF replaces the need for any data cleaning","cuDF largely mirrors the pandas API, so much existing code needs minimal changes","cuDF runs common dataframe operations on GPU, which can be dramatically faster at scale","cuDF requires no GPU and runs identically on CPU only"],"a":[1,2],"e":"The value proposition of cuDF is GPU speed plus API familiarity -- it does require a GPU, and it doesn't replace the need to actually clean/curate data."},
{"d":"Data Analysis","q":"Pick TWO correct statements about handling severe class imbalance in a dataset.","o":["Oversampling always means deleting majority-class rows","Class weighting changes the loss penalty per class without altering the stored dataset","Accuracy is the most informative metric to track in this situation","SMOTE generates synthetic minority-class samples by interpolation"],"a":[1,3],"e":"SMOTE and class weighting are both real, distinct imbalance techniques described correctly here. Accuracy is a poor headline metric under severe imbalance, and oversampling means duplicating/generating minority rows, not deleting majority ones."},
{"d":"Trustworthy AI","q":"Bias in an AI system most often originates from:","o":["Skewed or unrepresentative training data, or design choices that encode unfair assumptions","The choice of optimizer alone","The programming language used to implement the model","The GPU hardware used for training"],"a":[0],"e":"Bias typically enters through the data (historical/societal skew, unrepresentative sampling) or through modeling/labeling choices, not through hardware or language choice."},
{"d":"Trustworthy AI","q":"An LLM confidently generates a plausible-sounding but factually incorrect statement. This is called:","o":["Prompt injection","Data leakage","Hallucination","Catastrophic forgetting"],"a":[2],"e":"Hallucination refers to a model generating fluent, confident content that is not actually grounded in truth or its training data."},
{"d":"Trustworthy AI","q":"RAG helps reduce hallucination primarily by:","o":["Increasing the decoding temperature","Making the model's weights larger","Grounding generation in retrieved, verifiable source documents at inference time","Removing the need for any evaluation"],"a":[2],"e":"By supplying real retrieved context in the prompt, RAG gives the model something true to work from and cite, reducing confident fabrication."},
{"d":"Trustworthy AI","q":"A privacy risk specific to large language models is that they may:","o":["Never retain any information from training data","Memorize and later regurgitate verbatim snippets of sensitive training data (e.g. PII)","Always encrypt their own weights","Only leak information about their optimizer"],"a":[1],"e":"LLMs can memorize rare or repeated sequences from training data closely enough to reproduce them on the right prompt, which is why PII filtering and privacy techniques matter."},
{"d":"Trustworthy AI","q":"Differential privacy, applied to model training, works by:","o":["Removing all personal data from the internet","Encrypting the final model weights only","Applying only at inference time, never during training","Adding calibrated noise during training so no single training example's presence can be reliably inferred from the model's output"],"a":[3],"e":"Differential privacy provides a mathematical guarantee that the model's behavior wouldn't meaningfully change whether or not any one individual's data was included, typically via noise injection during training."},
{"d":"Trustworthy AI","q":"Jailbreaking an LLM refers specifically to:","o":["A hardware failure on the GPU cluster","Crafting inputs designed to bypass the model's safety training/guardrails and elicit disallowed behavior","A synonym for fine-tuning","A type of data leakage in the training set"],"a":[1],"e":"Jailbreaks are adversarial prompts engineered to circumvent safety alignment -- a core threat that guardrails and red-teaming aim to catch and close."},
{"d":"Trustworthy AI","q":"SHAP (SHapley Additive exPlanations) provides model explainability by:","o":["Training a smaller distilled model","Attributing a prediction's outcome to each input feature's contribution, based on cooperative game theory","Removing features from the model permanently","Increasing the model's overall accuracy"],"a":[1],"e":"SHAP values quantify how much each feature pushed a specific prediction up or down, using a game-theoretic framework (Shapley values) for fair attribution."},
{"d":"Trustworthy AI","q":"LIME (Local Interpretable Model-agnostic Explanations) explains a prediction by:","o":["Fitting a simple, interpretable local model around one specific prediction to approximate the complex model's behavior nearby","Training a completely new global model from scratch","Only working on linear models","Deleting the model's weights"],"a":[0],"e":"LIME perturbs the input around one instance and fits an interpretable surrogate locally, explaining that single prediction without understanding the whole black box globally."},
{"d":"Trustworthy AI","q":"A model card is intended to:","o":["Document a model's intended use, performance across subgroups, limitations, and training data at a glance","Replace the need for any testing","Serve as the model's API authentication key","Store the model's raw weights for download"],"a":[0],"e":"Model cards are structured documentation so downstream users understand a model's intended use, known limitations, and evaluation results before deploying it."},
{"d":"Trustworthy AI","q":"Red-teaming an AI system means:","o":["Running a standard A/B test","Proactively attacking/probing a model to discover harmful, biased, or unsafe behaviors before real-world deployment","Optimizing the model for speed only","Compressing the model via quantization"],"a":[1],"e":"Red teams deliberately try to break a model's safety behavior to surface issues before they reach production."},
{"d":"Trustworthy AI","q":"Which is NOT typically one of the pillars emphasized in NVIDIA's trustworthy-AI framing?","o":["Privacy","Transparency and explainability","Safety and security","Maximizing model size at all costs"],"a":[3],"e":"Trustworthy AI principles focus on privacy, safety/security, transparency/explainability, and non-discrimination/fairness -- not simply scaling model size."},
{"d":"Trustworthy AI","q":"NeMo Guardrails contributes to trustworthy AI by:","o":["Providing embeddings for retrieval","Cleaning the pretraining corpus of PII","Enforcing programmable rules (topic control, moderation, jailbreak defense) around an LLM's inputs and outputs","Compiling the model for faster inference"],"a":[2],"e":"Guardrails is the safety/behavior-control layer, separate from data curation or inference optimization."},
{"d":"Trustworthy AI","q":"Content/toxicity moderation on LLM outputs is an example of addressing which trustworthy-AI concern?","o":["Vector database indexing speed","GPU utilization","Model compression efficiency","Safety -- preventing harmful or offensive generated content from reaching users"],"a":[3],"e":"Toxicity filtering directly targets the safety pillar, independent of performance or infrastructure concerns."},
{"d":"Trustworthy AI","q":"A fairness audit checking whether a model's error rate differs significantly across demographic groups is testing for:","o":["Catastrophic forgetting","Vanishing gradients","Data leakage","Disparate impact / fairness across subgroups"],"a":[3],"e":"Comparing performance/error rates across subgroups is exactly how disparate impact / fairness issues are detected and measured."},
{"d":"Trustworthy AI","q":"Transparency and interpretability, as distinct trustworthy-AI concepts, differ in that:","o":["They are identical and interchangeable in every context","Transparency is about openly disclosing how a system works and its limitations; interpretability is about being able to understand why a specific decision was made","Transparency only applies to open-source models","Interpretability only applies to linear regression"],"a":[1],"e":"Transparency is more about disclosure (documentation, model cards); interpretability is more about explaining specific outputs (e.g. via SHAP/LIME)."},
{"d":"Trustworthy AI","q":"Accountability in an AI system deployment refers to:","o":["Having clear ownership and processes for addressing harms, errors, or unintended consequences the system causes","Whether the GPU cluster has enough memory","The model's parameter count","The choice of tokenizer"],"a":[0],"e":"Accountability is an organizational/process concept -- someone must be responsible for monitoring, responding to, and correcting problems the deployed system causes."},
{"d":"Trustworthy AI","q":"Concerns about training-data provenance and licensing fall under which trustworthy-AI theme?","o":["Batch size selection","Data governance and legal/ethical sourcing of training data","GPU thermal management","Attention head count"],"a":[1],"e":"Provenance/licensing questions are a data-governance and legal-risk concern, central to responsible AI development."},
{"d":"Trustworthy AI","q":"Testing a model's outputs against small, deliberately perturbed or adversarial inputs to see if predictions change unreasonably is checking for:","o":["Perplexity","Chunk overlap","Robustness","GPU utilization"],"a":[2],"e":"Robustness testing probes whether small, often imperceptible input changes cause disproportionate or unsafe changes in output."},
{"d":"Trustworthy AI","q":"Keeping a human reviewer in the approval loop for high-stakes automated decisions (e.g. loan denials) is an example of:","o":["Catastrophic forgetting mitigation","Human-in-the-loop oversight, a common trustworthy-AI safeguard for high-impact decisions","Gradient clipping","Data augmentation"],"a":[1],"e":"Human-in-the-loop review adds an accountability/safety check specifically for consequential decisions, rather than letting the model's output apply automatically."},
{"d":"Trustworthy AI","q":"Pick TWO practices that directly support user consent and appropriate data-usage rights in an AI product.","o":["Clearly disclosing what user data is collected and how it will be used for model training","Maximizing data collection regardless of stated purpose","Silently including all user interactions in future training data by default","Allowing users to opt out of having their data used for training where feasible"],"a":[0,3],"e":"Transparent disclosure and meaningful opt-out choices respect consent and data rights; silently repurposing data or over-collecting undermines exactly that."}

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

btnC=document.getElementById("qcheck"),btnN=document.getElementById("qnext");
function start(){order=shuffle(BANK.map((_,i)=>i));idx=0;score=0;domTot={};domOk={};
BANK.forEach(q=>{domTot[q.d]=(domTot[q.d]||0)+1;domOk[q.d]=0;});
btnC.style.display="";btnN.style.display="";render();}
function render(){answered=false;const q=BANK[order[idx]],multi=q.a.length>1;
count.textContent="Question "+(idx+1)+" / "+BANK.length;
dom.textContent=q.d+(multi?" · PICK TWO":"");
bar.style.width=(idx/BANK.length*100)+"%";
let h='<p class="qtext">'+q.q+"</p>";
q.o.forEach((o,i)=>{h+='<label class="opt"><input type="'+(multi?"checkbox":"radio")+'" name="opt" value="'+i+'"><span>'+o+"</span></label>";});
h+='<div class="exp" id="qexp"></div>';
body.innerHTML=h;btnC.disabled=false;btnN.disabled=true;}
btnC.addEventListener("click",()=>{if(answered)return;
const q=BANK[order[idx]];
const picked=[...body.querySelectorAll("input:checked")].map(x=>+x.value);
if(!picked.length)return;
answered=true;
const ok=picked.length===q.a.length&&picked.every(p=>q.a.includes(p));
if(ok){score++;domOk[q.d]++;}
body.querySelectorAll(".opt").forEach((el,i)=>{
const inp=el.querySelector("input");inp.disabled=true;
if(q.a.includes(i))el.classList.add("correct");
else if(picked.includes(i))el.classList.add("wrong");});
const exp=document.getElementById("qexp");
exp.innerHTML='<span class="verdict '+(ok?"ok":"bad")+'">'+(ok?"Correct":"Not quite")+"</span>"+q.e+'<div style="margin-top:.6rem"><button class="btn ghost" type="button" id="qask">💬 ask about this question</button></div>';
document.getElementById("qask").addEventListener("click",(ev)=>{
ev.stopPropagation();
const optLabels="ABCDE";
const optsText=q.o.map((o,i)=>optLabels[i]+". "+o).join("\n");
const correctText=q.a.map(i=>optLabels[i]).join(", ");
const ctx="Question: "+q.q+"\n\nOptions:\n"+optsText+"\n\nCorrect answer: "+correctText+"\n\nExplanation: "+q.e;
window.showAsk("",q.d+" — "+(q.q.length>70?q.q.slice(0,70)+"…":q.q),ctx);
});
exp.classList.add("show");btnC.disabled=true;btnN.disabled=false;btnN.focus();});
btnN.addEventListener("click",()=>{idx++;
if(idx<BANK.length){render();}else{finish();}});
function finish(){bar.style.width="100%";count.textContent="Complete";dom.textContent="";
const pct=Math.round(score/BANK.length*100);
let h='<div class="scorecard"><div class="big">'+pct+"%</div><p>"+score+" of "+BANK.length+" correct — "+
(pct>=80?"exam-ready. Keep it warm with the cheat table.":pct>=65?"close: the real bar is roughly 70-75%. Rework your weakest domain below.":"not yet -- re-study the two weakest domains, then retake.")+
'</p><div class="dombars">';
Object.keys(domTot).forEach(d=>{const p=Math.round(domOk[d]/domTot[d]*100);
h+='<div class="wrow"><span>'+d+'</span><span class="wbar"><span class="wfill" style="width:'+p+'%"></span></span><span class="wnum">'+domOk[d]+"/"+domTot[d]+"</span></div>";});
h+='</div></div>';body.innerHTML=h;
btnC.style.display="none";btnN.style.display="none";
const rb=document.createElement("button");rb.className="btn";rb.type="button";rb.textContent="Retake (reshuffled)";
rb.addEventListener("click",start);body.querySelector(".scorecard").appendChild(rb);}
start();

/* ---------- ask Azure OpenAI about the current question ---------- */
const vask=document.getElementById("vask");
let askTopic="",askContext="",askHistory=[];
function showAsk(q,topic,context){
  askTopic=topic||"";askContext=context||"";askHistory=[];
  vask.innerHTML='<div class="vlbl">Ask about: <span id="askTopicLbl"></span></div>'
    +'<textarea id="askInput" rows="2" placeholder="Why is the correct answer right, or why is my pick wrong?"></textarea>'
    +'<div class="vbtns"><button class="btn" type="button" data-vcopy>Copy question</button>'
    +'<button class="btn" type="button" data-vaskllm>Ask Azure OpenAI</button>'
    +'<button class="btn ghost" type="button" data-vclose>Close</button><span class="vnote"></span></div>'
    +'<div class="askAnswer" id="askAnswer"></div>';
  vask.querySelector("#askTopicLbl").textContent=askTopic||"this";
  vask.querySelector("#askInput").value=q||"";
  vask.style.display="block";
  vask.querySelector("#askInput").focus();}
window.showAsk=showAsk;
function doCopy(){
  const q=vask.querySelector("#askInput").value,note=vask.querySelector(".vnote");
  const ok=()=>{note.textContent="copied ✓";};
  const fb=()=>{const ta=document.createElement("textarea");ta.value=q;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok();}catch(e){note.textContent="select the text above and copy manually";}ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(q).then(ok,fb);else fb();}
async function doAskLLM(){
  const input=vask.querySelector("#askInput"),q=input.value.trim(),ans=vask.querySelector("#askAnswer"),
    btn=vask.querySelector("[data-vaskllm]"),note=vask.querySelector(".vnote");
  if(!q)return;
  ans.style.display="block";ans.textContent="Thinking…";btn.disabled=true;note.textContent="";
  try{
    const res=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({topic:askTopic,context:askContext,question:q,history:askHistory})});
    const data=await res.json();
    if(data.error){ans.textContent="Error: "+data.error;}
    else{ans.textContent=data.answer;askHistory.push({role:"user",content:q});askHistory.push({role:"assistant",content:data.answer});
      note.textContent="ask a follow-up above and click again — this panel remembers the thread";}
  }catch(e){ans.textContent="Request failed: "+e.message+" — is mcq_server.py running? (python mcq_server.py, then open http://localhost:5002)";}
  btn.disabled=false;}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-vcopy]")){doCopy();return;}
  if(e.target.closest("[data-vaskllm]")){doAskLLM();return;}
  if(e.target.closest("[data-vclose]")){vask.style.display="none";return;}
  if(e.target.closest("#vask"))return;});
document.addEventListener("keydown",e=>{if(e.key==="Escape")vask.style.display="none";});
</script>
</body></html>
