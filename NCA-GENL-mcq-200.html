<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCA-GENL — 200 Fresh Practice MCQs</title><style>

<script>
const BANK=[
{"d":"Core ML","q":"A model trains on labeled input-output pairs to predict outputs for new inputs. Which learning paradigm is this?","o":["Supervised learning","Unsupervised learning","Reinforcement learning","Self-supervised learning"],"a":[0],"e":"Supervised learning uses labeled pairs. Unsupervised learning finds structure without labels; reinforcement learning learns from reward signals; self-supervised learning generates its own labels from the data."},
{"d":"Core ML","q":"Clustering customers into segments without any predefined labels is an example of which paradigm?","o":["Semi-supervised learning","Unsupervised learning","Reinforcement learning","Supervised learning"],"a":[1],"e":"No labels are provided -- the model discovers structure (clusters) on its own, which is unsupervised learning."},
{"d":"Core ML","q":"An agent learns to play a game by receiving rewards and penalties for its actions over time. Which paradigm is this?","o":["Self-supervised learning","Reinforcement learning","Supervised learning","Unsupervised learning"],"a":[1],"e":"Reinforcement learning maximizes cumulative reward from an environment through trial and error, rather than learning from a fixed labeled dataset."},
{"d":"Core ML","q":"LLM pretraining predicts the next word in a sentence using only the raw text itself, with no human-provided labels. What is this called?","o":["Active learning","Self-supervised learning","Reinforcement learning","Supervised fine-tuning"],"a":[1],"e":"Self-supervised learning derives labels from the data itself -- here, the next word is the 'label,' requiring no manual annotation."},
{"d":"Core ML","q":"What does RLHF stand for and rely on?","o":["Randomized Loss for Hidden Features","Reinforcement Learning with Heuristic Functions","Reinforcement Learning from Human Feedback","Recursive Learning of Hidden Factors"],"a":[2],"e":"RLHF uses human preference judgments (e.g. ranking model outputs) as the reward signal to fine-tune a model via reinforcement learning."},
{"d":"Core ML","q":"In the standard neural-network training loop, what does the forward pass compute?","o":["The model's prediction for the current input batch","The gradient of the loss with respect to each weight","The updated weight values","The learning-rate schedule"],"a":[0],"e":"The forward pass runs input through the network to produce a prediction; gradients (backward pass) and weight updates (optimizer step) come afterward."},
{"d":"Core ML","q":"Backpropagation's core mathematical tool is:","o":["The chain rule of calculus","Linear programming","Singular value decomposition","Bayes' theorem"],"a":[0],"e":"Backprop computes each weight's gradient by multiplying local derivatives backward through the computation graph -- repeated application of the chain rule."},
{"d":"Core ML","q":"What is the role of the loss function during training?","o":["It quantifies how wrong the model's predictions are","It selects which optimizer to use","It stores the model's weights","It normalizes the input features"],"a":[0],"e":"The loss is a scalar score of prediction error; gradients of this score drive every weight update."},
{"d":"Core ML","q":"Which optimizer maintains a per-parameter adaptive step size using estimates of the gradient's first and second moments?","o":["Momentum SGD","Batch gradient descent","Plain SGD","Adam"],"a":[3],"e":"Adam tracks an exponential moving average of the gradient (first moment) and its squared value (second moment) to scale each parameter's step individually."},
{"d":"Core ML","q":"AdamW improves on Adam mainly by:","o":["Decoupling weight decay from the gradient-based update","Adding a second learning rate schedule","Replacing softmax with sigmoid","Removing momentum entirely"],"a":[0],"e":"AdamW applies weight decay directly to the weights rather than folding it into the adaptive gradient update -- this fix is why AdamW is the default for transformers."},
{"d":"Core ML","q":"Training loss keeps falling but validation loss starts rising after several epochs. This is:","o":["Data leakage","Underfitting","Overfitting","Vanishing gradients"],"a":[2],"e":"A widening gap where training error keeps improving while validation error worsens is the signature of overfitting -- the model is memorizing training data."},
{"d":"Core ML","q":"Both training and validation error remain high and roughly equal throughout training. This suggests:","o":["Underfitting","Exploding gradients","Overfitting","Data leakage"],"a":[0],"e":"High error on both sets (high bias) that doesn't improve indicates the model is too simple or undertrained for the task -- underfitting."},
{"d":"Core ML","q":"Which of these is NOT a standard fix for overfitting?","o":["Increasing model depth with no other changes","L2 weight decay","Dropout","Early stopping"],"a":[0],"e":"Making the model bigger with nothing else changed typically worsens overfitting. Dropout, early stopping, and weight decay all constrain the model to generalize better."},
{"d":"Core ML","q":"Why must hyperparameters be tuned on a validation set rather than the test set?","o":["Validation sets are always larger","Tuning on the test set leaks information and inflates the reported score","Test sets cannot contain labels","The test set is usually smaller"],"a":[1],"e":"If you tune choices using the test set, your final reported performance no longer reflects true generalization -- it's been indirectly fit to that data."},
{"d":"Core ML","q":"Which activation is the smooth, differentiable-everywhere variant used in transformer feed-forward layers?","o":["Sigmoid","Softmax","ReLU","GELU"],"a":[3],"e":"GELU is a smooth approximation of ReLU's behavior and is the standard activation inside transformer FFN blocks; ReLU has a sharp kink at zero."},
{"d":"Core ML","q":"Sigmoid's squashing range makes it the natural output activation for:","o":["Next-token prediction over a large vocabulary","Multi-class classification","Binary classification","Regression with unbounded targets"],"a":[2],"e":"Sigmoid outputs a single value in (0,1), interpretable as a probability of the positive class -- ideal for binary classification. Multi-class and next-token prediction use softmax."},
{"d":"Core ML","q":"Softmax is used for all of the following EXCEPT:","o":["Producing next-token probabilities","Binary classification with a single output neuron","Multi-class classification output layer","Turning attention scores into weights"],"a":[1],"e":"A single-output binary classifier uses sigmoid, not softmax. Softmax needs multiple logits to turn into a competing probability distribution."},
{"d":"Core ML","q":"Cross-entropy loss is the standard choice for:","o":["Clustering","Regression tasks with continuous targets","Classification and next-token prediction","Dimensionality reduction"],"a":[2],"e":"Cross-entropy compares a predicted probability distribution to a true one-hot (or soft) target -- the natural loss for classification, including LLM next-token prediction."},
{"d":"Core ML","q":"Mean squared error (MSE) is most appropriate for:","o":["Regression tasks predicting continuous values","Next-token prediction in LLMs","Ranking retrieved documents","Multi-class image classification"],"a":[0],"e":"MSE penalizes squared distance from a continuous target -- the standard regression loss. Classification tasks use cross-entropy instead."},
{"d":"Core ML","q":"Why do deep sigmoid networks historically become hard to train?","o":["Sigmoid's derivative is at most 0.25, so gradients shrink multiplicatively through many layers","Sigmoid outputs are always negative","Sigmoid requires integer inputs","Sigmoid has no derivative"],"a":[0],"e":"Each layer multiplies the backpropagated gradient by sigmoid's derivative (<=0.25). Through 15-20 layers this product collapses toward zero -- the vanishing gradient problem."},
{"d":"Core ML","q":"Which technique directly addresses exploding gradients?","o":["Softmax temperature","Increasing batch size only","Dropout","Gradient clipping"],"a":[3],"e":"Gradient clipping caps the gradient's norm before the update is applied, preventing a single large gradient from blowing up the weights."},
{"d":"Core ML","q":"Residual (skip) connections primarily help deep networks by:","o":["Replacing the need for an activation function","Providing an identity path that lets gradients flow through many layers undamaged","Eliminating the need for normalization","Reducing the number of parameters"],"a":[1],"e":"h = x + F(x) means the derivative includes a constant '1' term, so gradient can flow straight back to early layers even if F's own gradient is tiny."},
{"d":"Core ML","q":"Which architecture uses learnable filters that slide over spatially structured input such as images?","o":["SVM","Transformer","RNN","CNN"],"a":[3],"e":"Convolutional neural networks apply shared, learned kernels across spatial positions, exploiting locality and translation invariance in image-like data."},
{"d":"Core ML","q":"What is the main limitation of RNNs/LSTMs compared to transformers for long sequences?","o":["They process tokens sequentially, blocking parallelization and struggling with long-range dependencies","They cannot be trained with backpropagation","They require more parameters than transformers for the same task","They cannot use GPUs at all"],"a":[0],"e":"RNNs update a hidden state one token at a time, so training can't parallelize across the sequence, and gradients over long distances tend to vanish -- self-attention avoids both."},
{"d":"Core ML","q":"Which classical algorithm finds a maximum-margin separating boundary and can use the kernel trick for non-linear boundaries?","o":["Decision tree","Support Vector Machine (SVM)","Naive Bayes","k-means"],"a":[1],"e":"SVMs maximize the margin between classes; kernels (RBF, polynomial) implicitly project data into higher dimensions to separate non-linear patterns."},
{"d":"Core ML","q":"A Generative Adversarial Network (GAN) trains which two components against each other?","o":["Encoder and decoder","Actor and critic","Generator and discriminator","Query and key"],"a":[2],"e":"The generator tries to produce realistic fake samples; the discriminator tries to distinguish real from fake -- a minimax game that improves both."},
{"d":"Core ML","q":"Diffusion models (e.g. behind Stable Diffusion) generate data by:","o":["Learning to iteratively denoise a noisy input back to a clean sample","Recursively applying self-attention only","Playing a minimax game between two networks","Directly sampling from a learned lookup table"],"a":[0],"e":"Diffusion models learn the reverse of a gradual noising process, denoising step by step from pure noise to a coherent sample."},
{"d":"Core ML","q":"A Variational Autoencoder (VAE) differs from a plain autoencoder mainly by:","o":["Being trained without any loss function","Requiring no decoder at all","Encoding inputs into a probability distribution over a latent space rather than a fixed point","Using convolutions instead of dense layers"],"a":[2],"e":"VAEs encode to parameters of a distribution (mean/variance) and sample from it, which regularizes the latent space and lets you sample new data by decoding random latents."},
{"d":"Core ML","q":"Byte-Pair Encoding (BPE) tokenization builds its vocabulary by:","o":["Splitting text only on whitespace","Assigning one token per character permanently","Randomly sampling substrings","Iteratively merging the most frequent adjacent symbol pairs"],"a":[3],"e":"BPE starts from individual characters/bytes and repeatedly merges the most frequent adjacent pair, building up common subwords -- this balances vocabulary size and sequence length."},
{"d":"Core ML","q":"WordPiece, used by BERT, differs from vanilla BPE mainly in:","o":["It requires no vocabulary at all","It never merges characters","It chooses merges that maximize the training data's likelihood rather than pure frequency","It only tokenizes numbers"],"a":[2],"e":"WordPiece's merge criterion is a likelihood-based score rather than raw frequency, though the overall idea of building subwords from merges is the same as BPE."},
{"d":"Core ML","q":"SentencePiece is notable among tokenizers because it:","o":["Only works for English text","Cannot produce subword tokens","Treats the input as a raw stream of Unicode characters, including spaces, so it needs no language-specific pre-tokenization","Requires pre-tokenized, whitespace-separated input"],"a":[2],"e":"SentencePiece operates directly on raw text (space is just another symbol), making it language-agnostic -- useful for languages that don't separate words with whitespace."},
{"d":"Core ML","q":"A static embedding (e.g. Word2Vec) differs from a contextual embedding (e.g. from BERT) in that:","o":["Static embeddings require a transformer","Contextual embeddings can't be learned end-to-end","A static embedding gives a word the same vector regardless of context; a contextual embedding produces a different vector depending on surrounding words","Static embeddings change per sentence context; contextual ones never do"],"a":[2],"e":"'Bank' gets one fixed Word2Vec vector no matter the sentence, but a contextual model produces a different vector for 'river bank' vs 'bank account'."},
{"d":"Core ML","q":"In the scaled dot-product attention formula Attention(Q,K,V) = softmax(QK^T/sqrt(d_k))*V, what does QK^T represent?","o":["The positional encodings","The vocabulary probabilities","The final output values","Similarity scores between each query and every key"],"a":[3],"e":"The dot product of a query with each key measures how relevant that key/token is to the query -- these raw scores are then scaled, softmaxed, and used to weight the values."},
{"d":"Core ML","q":"Why divide the attention scores by sqrt(d_k) before the softmax?","o":["To make the scores integers","To remove the need for positional encoding","To increase the vocabulary size","To prevent large-magnitude dot products from pushing softmax into a near-zero-gradient regime"],"a":[3],"e":"As key dimension grows, dot products grow in magnitude and can push softmax into a saturated, winner-take-all region with vanishing gradients; scaling keeps values in a well-behaved range."},
{"d":"Core ML","q":"What is the main benefit of multi-head attention over a single attention head?","o":["Each head can attend to different types of relationships in parallel, in different subspaces","It removes the need for a value projection","It guarantees causal masking","It reduces the model's parameter count"],"a":[0],"e":"Splitting Q/K/V into multiple smaller heads lets the model jointly attend to different relationships (e.g. syntax vs. coreference) instead of averaging everything into one attention pattern."},
{"d":"Core ML","q":"Sinusoidal positional encoding is used in transformers to:","o":["Normalize attention scores","Reduce the vocabulary size","Replace the need for an embedding layer","Inject information about token order, since self-attention itself is permutation-invariant"],"a":[3],"e":"Attention treats tokens as an unordered set unless position is added in; fixed sinusoidal functions of position give each position a unique, smoothly varying signal, added to the token embedding."},
{"d":"Core ML","q":"Rotary Positional Embedding (RoPE) encodes position by:","o":["Concatenating a one-hot position vector to the embedding","Replacing softmax with a positional lookup table","Adding random noise scaled by position","Rotating the query and key vectors by an angle proportional to their position, so relative position falls out of the dot product"],"a":[3],"e":"RoPE applies a position-dependent rotation to Q and K; the dot product between two rotated vectors ends up depending only on their relative distance, which generalizes well to longer sequences."},
{"d":"Core ML","q":"Causal masking in a decoder-only transformer ensures that:","o":["Padding tokens receive the highest attention weight","Each position can only attend to itself and earlier positions, never future tokens","Every token can attend to every other token, including future ones","Attention scores are always symmetric"],"a":[1],"e":"Causal masking sets attention scores to future positions to -infinity before softmax, forcing the model to predict each token using only what came before it."},
{"d":"Core ML","q":"Cross-attention in an encoder-decoder model (e.g. T5) is used so that:","o":["The decoder can attend only to its own previously generated tokens","The decoder can attend to the encoder's output representations of the source sequence","The encoder can attend to the decoder's output","Positional encodings are shared between encoder and decoder"],"a":[1],"e":"Cross-attention lets each decoder position query the full encoded source sequence, separately from the decoder's own self-attention over its generated tokens."},
{"d":"Core ML","q":"BERT's pretraining objective and typical use case is best described as:","o":["Reward-based fine-tuning, used only for chat","Autoregressive next-token prediction, used for open-ended text generation","Denoising diffusion, used for image generation","Masked-token prediction (bidirectional), used for understanding tasks like classification and extraction"],"a":[3],"e":"BERT is an encoder trained to predict randomly masked tokens using context from both directions -- great for understanding/classification, but not built to generate open-ended text."},
{"d":"Core ML","q":"GPT-style models are trained with which objective, making them naturally suited to text generation?","o":["Bidirectional masked-span infilling only","Contrastive image-text alignment","Masked language modeling","Autoregressive next-token prediction, conditioning only on prior tokens"],"a":[3],"e":"GPT is a decoder-only model trained to predict the next token given everything before it -- the same mechanism used at inference time to generate text one token at a time."},
{"d":"Core ML","q":"T5 frames every NLP task as text-to-text and uses which architecture?","o":["No attention mechanism at all","Decoder-only","Encoder-only","Full encoder-decoder (sequence-to-sequence)"],"a":[3],"e":"T5 is a classic encoder-decoder transformer: the encoder reads the input, the decoder generates the output conditioned on it via cross-attention."},
{"d":"Core ML","q":"You need a model to classify support tickets into 12 categories. Which architecture family is the natural fit?","o":["Decoder-only generative model, required","A diffusion model","Encoder-only model like BERT, fine-tuned with a classification head","Encoder-decoder sequence-to-sequence model, required"],"a":[2],"e":"Classification is an understanding task with a fixed output space -- an encoder-only model with a classification head is the standard, efficient choice."},
{"d":"Core ML","q":"The typical LLM lifecycle, in order, is:","o":["Fine-tuning then Pretraining then Deployment","SFT then Pretraining then RLHF","Pretraining then Supervised fine-tuning (SFT) then RLHF/DPO alignment","RLHF then Pretraining then SFT"],"a":[2],"e":"A base model first pretrains on massive unlabeled text, then is fine-tuned on instruction/response pairs (SFT), then aligned to human preference via RLHF or DPO."},
{"d":"Core ML","q":"Direct Preference Optimization (DPO) is popular as an alternative to RLHF/PPO because it:","o":["Eliminates the need for pretraining","Requires no preference data at all","Only works on vision models","Optimizes directly on preference pairs with a single loss, avoiding a separate reward model and RL training loop"],"a":[3],"e":"DPO reformulates the RLHF objective into a classification-style loss over chosen/rejected response pairs, skipping the reward-model-plus-PPO pipeline."},
{"d":"Core ML","q":"LoRA (Low-Rank Adaptation) reduces fine-tuning cost by:","o":["Removing the attention mechanism","Deleting most of the base model's layers","Freezing the base weights and learning two small low-rank matrices whose product is added to the frozen weight","Training in FP64 for extra precision"],"a":[2],"e":"LoRA injects delta-W = A*B (rank r much smaller than the full dimension) alongside a frozen pretrained weight; only A and B are trained."},
{"d":"Core ML","q":"QLoRA extends LoRA primarily by:","o":["Requiring multiple GPUs at minimum","Keeping the frozen base model in 4-bit precision while training LoRA adapters in higher precision","Removing the adapters entirely","Increasing the LoRA rank to match the full weight matrix"],"a":[1],"e":"QLoRA quantizes the frozen base weights to 4-bit (e.g. NF4) to shrink memory further, while the small trainable LoRA matrices still update in higher precision."},
{"d":"Core ML","q":"Adapter modules and LoRA are both examples of:","o":["Parameter-efficient fine-tuning (PEFT)","Prompt engineering","Full fine-tuning","Data augmentation"],"a":[0],"e":"Both approaches add or modify a small number of new parameters while freezing most of the base model -- the defining trait of PEFT methods."},
{"d":"Core ML","q":"Prompt tuning (as a PEFT method) works by:","o":["Removing tokens from the vocabulary","Learning a small set of continuous 'virtual token' embeddings prepended to the input, while the base model stays frozen","Replacing the loss function with cross-entropy","Editing the base model's attention weights directly"],"a":[1],"e":"Prompt/prefix tuning learns extra trainable embeddings fed into the model alongside the real input tokens; the pretrained weights themselves never change."},
{"d":"Core ML","q":"Full fine-tuning a model on a narrow new task and seeing its general capabilities degrade afterward is known as:","o":["Mode collapse","Vanishing gradients","Data leakage","Catastrophic forgetting"],"a":[3],"e":"Catastrophic forgetting happens when updating all weights on a narrow dataset overwrites broadly useful knowledge; PEFT methods like LoRA mitigate this."},
{"d":"Core ML","q":"Greedy decoding generates text by:","o":["Sampling randomly from the full vocabulary distribution each step","Tracking multiple candidate sequences and keeping the top-k by cumulative probability","Always picking the single highest-probability token at each step","Selecting the least-probable token to maximize diversity"],"a":[2],"e":"Greedy decoding is deterministic -- pick the argmax token every step -- but it can miss globally better sequences and tends to produce repetitive text."},
{"d":"Core ML","q":"Beam search improves on greedy decoding by:","o":["Sampling tokens with added randomness","Only ever considering the first token generated","Keeping several of the most promising partial sequences at each step instead of committing to just one","Ignoring the model's probabilities entirely"],"a":[2],"e":"Beam search tracks the top-k highest-probability partial sequences ('beams') at each step, exploring more of the search space than greedy's single path."},
{"d":"Core ML","q":"Increasing the decoding 'temperature' has what effect on the next-token distribution?","o":["It flattens the probability distribution, making less-likely tokens relatively more probable and output more random","It always picks the same token as temperature=0","It removes the need for a softmax","It guarantees grammatically correct output"],"a":[0],"e":"Temperature divides the logits before softmax; T>1 flattens the distribution, T<1 sharpens it toward the top choices, T close to 0 approaches greedy decoding."},
{"d":"Core ML","q":"Top-k sampling restricts the next-token choice to:","o":["The k highest-probability tokens, renormalized, then sampled from","The k tokens with the lowest probability","Exactly one token, chosen deterministically","All tokens above a fixed probability threshold that adapts each step"],"a":[0],"e":"Top-k keeps only the k most likely tokens and samples among them -- that fixed cutoff is the key difference from top-p, which uses a variable cutoff."},
{"d":"Core ML","q":"Top-p (nucleus) sampling differs from top-k because it:","o":["Is identical to greedy decoding","Always samples from exactly p tokens regardless of the distribution's shape","Selects the smallest set of tokens whose cumulative probability exceeds p, so the number of candidates varies by context","Ignores the model's probability distribution entirely"],"a":[2],"e":"Top-p adapts to the distribution's shape: a peaked distribution needs few tokens to reach cumulative probability p, a flat one needs many -- unlike top-k's fixed candidate count."},
{"d":"Core ML","q":"Stacking two linear layers with no non-linearity between them is mathematically equivalent to:","o":["An attention mechanism","A much deeper network with new representational power","A single linear layer, since W2(W1x) = (W2W1)x","A convolutional layer"],"a":[2],"e":"Without a non-linearity, the composition of two linear maps is itself linear -- depth adds no new expressive power."},
{"d":"Core ML","q":"During backpropagation, a hidden unit's pre-activation was negative and passed through ReLU. What gradient does it receive on the backward pass?","o":["Exactly the same gradient as if it were positive","Exactly zero, since ReLU's derivative is 0 for negative inputs","Twice the incoming gradient","A random gradient"],"a":[1],"e":"ReLU's derivative is 0 for x<0, so no gradient flows back through that unit or into the weights that fed it on this example -- the 'dead ReLU' phenomenon."},
{"d":"Core ML","q":"Pick TWO techniques that specifically address vanishing gradients in deep networks.","o":["Residual/skip connections","ReLU activation (derivative is 1 for positive inputs)","Using MSE loss instead of cross-entropy","Increasing the batch size only"],"a":[0,1],"e":"ReLU avoids sigmoid's small derivative, and residual connections give gradients an undamaged identity path back to early layers -- both directly counter vanishing gradients."},
{"d":"Core ML","q":"Pick TWO statements that correctly describe self-attention's advantage over RNNs for training on GPUs.","o":["Self-attention has no positional information whatsoever, which is an advantage","Parallel computation across the sequence lets self-attention exploit GPU hardware much better than a sequential RNN","Self-attention computes all token-pair interactions in parallel, unlike RNNs' sequential updates","RNNs and self-attention parallelize identically"],"a":[1,2],"e":"Because attention scores for every token pair can be computed simultaneously, training parallelizes across the whole sequence -- RNNs must update step by step."},
{"d":"Core ML","q":"Pick TWO correct pairings of architecture with its typical role.","o":["Decoder-only (GPT) feeds open-ended text generation","GANs feed retrieval-augmented generation","Encoder-only (BERT) feeds understanding/classification tasks","Encoder-only (BERT) feeds open-ended text generation"],"a":[0,2],"e":"BERT-style encoders are suited to understanding/classification; GPT-style decoders generate text autoregressively. BERT is not built for open-ended generation, and GANs have nothing to do with RAG."},
{"d":"Software Dev","q":"A task needs no training and just a clear instruction with no examples. Which prompting technique fits?","o":["Chain-of-thought","Few-shot","Self-consistency","Zero-shot"],"a":[3],"e":"Zero-shot gives only the task instruction, relying on the model's existing knowledge -- appropriate for simple, common tasks."},
{"d":"Software Dev","q":"Providing 3 worked examples in the prompt before the real question, without any weight updates, is:","o":["Fine-tuning","RLHF","Few-shot (in-context) learning","Distillation"],"a":[2],"e":"Few-shot prompting demonstrates the desired format/behavior via examples in the context window itself -- no training occurs."},
{"d":"Software Dev","q":"Asking a model to 'think step by step' before giving a final answer is an example of:","o":["Zero-shot prompting","RAG","Chain-of-thought prompting","Quantization"],"a":[2],"e":"Chain-of-thought prompting elicits intermediate reasoning steps, which measurably improves performance on multi-step math/logic tasks."},
{"d":"Software Dev","q":"A persistent instruction that sets the assistant's persona and behavior across an entire session, outside the user's turn, is the:","o":["Few-shot example","System prompt","Reranker","Guardrail config only"],"a":[1],"e":"The system prompt is a standing instruction (tone, role, constraints) that applies for the whole conversation, distinct from any single user message."},
{"d":"Software Dev","q":"Sampling several different chain-of-thought reasoning paths and taking a majority vote on the final answer is called:","o":["Beam search","Self-consistency","Zero-shot prompting","Prompt injection"],"a":[1],"e":"Self-consistency generates multiple independent reasoning chains and picks the most common answer, trading extra compute for higher accuracy."},
{"d":"Software Dev","q":"A prompting pattern that interleaves the model's reasoning with calls to external tools like search or a calculator is:","o":["ReAct","Chain-of-thought only","Cross-attention","Few-shot only"],"a":[0],"e":"ReAct explicitly interleaves 'Reason' steps and 'Act' (tool call) steps, letting the model incorporate real-time information or computation it can't do on its own."},
{"d":"Software Dev","q":"Adversarial text hidden in a retrieved document that overrides the model's original instructions is an example of:","o":["Chain-of-thought","Catastrophic forgetting","Data leakage","Prompt injection"],"a":[3],"e":"Prompt injection smuggles new instructions through user input or retrieved content, hijacking the model's behavior away from its intended task."},
{"d":"Software Dev","q":"Which is a recommended mitigation for prompt injection?","o":["Input sanitization, privilege separation, and guardrails","Increasing the model's temperature","Removing the system prompt entirely","Disabling retrieval entirely for all applications"],"a":[0],"e":"Since injected text often arrives through retrieved or user content, treating it as untrusted input, separating privileges, and applying guardrail checks are the standard defenses."},
{"d":"Software Dev","q":"You need a chatbot to answer questions using your company's constantly-changing internal wiki, with citations. What's the best-fit approach?","o":["Prompt engineering alone","RAG (retrieval-augmented generation)","Reducing the model's temperature to 0","Fine-tuning the base model on the wiki text"],"a":[1],"e":"RAG updates instantly (just re-index), naturally supports citations, and avoids baking a fast-changing knowledge base into frozen model weights."},
{"d":"Software Dev","q":"In the RAG ingestion phase, documents are split into smaller pieces before embedding. This step is called:","o":["Reranking","Chunking","Distillation","Quantization"],"a":[1],"e":"Chunking breaks long documents into smaller units (with some overlap) so each embedding vector represents a focused, retrievable piece of content."},
{"d":"Software Dev","q":"Why do RAG pipelines typically use overlapping chunks rather than clean, non-overlapping splits?","o":["Overlap ensures a sentence straddling a chunk boundary still survives intact within at least one chunk","Overlap is required by all embedding models","Overlap makes the vector database smaller","Overlap eliminates the need for a reranker"],"a":[0],"e":"Without overlap, a fact split exactly at a chunk boundary can lose its context in both halves; a 10-20% overlap keeps boundary-spanning sentences whole somewhere."},
{"d":"Software Dev","q":"In RAG, why must the same embedding model be used for both documents (offline) and the incoming query (online)?","o":["It isn't required -- any two embedding models work interchangeably","The vector database enforces this via its schema, not the math","Vectors from different embedding models don't live in a comparable space, so similarity search would be meaningless","Different models produce vectors of different byte size only"],"a":[2],"e":"Embedding spaces are model-specific; comparing a document vector from model A to a query vector from model B produces meaningless similarity scores."},
{"d":"Software Dev","q":"A bi-encoder is used for retrieval rather than a cross-encoder because:","o":["Bi-encoders require no vector database","Bi-encoders are always more accurate","Bi-encoders embed query and documents independently, so document vectors can be precomputed offline and searched in milliseconds","Cross-encoders cannot process text pairs"],"a":[2],"e":"A cross-encoder must run the query and a candidate together through the full model -- accurate but expensive per pair -- which only scales if you first narrow candidates with a cheap bi-encoder."},
{"d":"Software Dev","q":"A cross-encoder reranker is typically applied:","o":["Only during model pretraining","Before any embedding happens","Only to the retriever's top 20-100 candidates, to re-score them more accurately before final selection","To every document in the corpus, replacing the vector database entirely"],"a":[2],"e":"Cross-encoders are too slow to run over millions of documents, so they're used as a second, more accurate pass over a small candidate shortlist from the fast bi-encoder retriever."},
{"d":"Software Dev","q":"Combining dense vector search with keyword-based BM25 scoring, then fusing the rankings, is known as:","o":["Distillation","Beam search","Pruning","Hybrid search"],"a":[3],"e":"Dense vectors catch paraphrase/semantic matches but can miss exact identifiers (part numbers, error codes); BM25 catches those. Hybrid search runs both and fuses results."},
{"d":"Software Dev","q":"Indexes like HNSW or IVF exist in vector databases because:","o":["They eliminate the need for embeddings","They replace the LLM in a RAG pipeline","Exact nearest-neighbor search over millions of vectors is too slow, so approximate search trades a little recall for huge speed gains","They only work for keyword search"],"a":[2],"e":"HNSW (graph-based) and IVF (clustering-based) return approximate nearest neighbors in sub-millisecond time with very high recall -- the standard tradeoff at scale."},
{"d":"Software Dev","q":"A RAG chatbot gives a confidently wrong answer. The most common root cause is:","o":["The system prompt being too long","A retrieval failure -- the right chunk never made it into the prompt","The LLM's generation step failing","The vector database being too fast"],"a":[1],"e":"Most 'the bot answered wrong' incidents trace back to retrieval, not generation -- measure retriever quality with recall@k/MRR before blaming the generator."},
{"d":"Software Dev","q":"LangChain and LlamaIndex are best described as:","o":["GPU kernel libraries","Model training frameworks like NeMo","Vector databases","Frameworks that orchestrate RAG/agent pipelines (chunking, retrieval, prompting)"],"a":[3],"e":"They provide the glue code and abstractions for building retrieval/agent pipelines; the underlying models, vector stores, and embeddings are typically pluggable components underneath."},
{"d":"Software Dev","q":"What does CUDA provide?","o":["A chat framework for LLM applications","A container orchestration system","A vector database for embeddings","A parallel computing platform and programming model for general-purpose GPU computing"],"a":[3],"e":"CUDA is the foundational programming model that lets code run across thousands of GPU threads in parallel -- nearly everything else in the NVIDIA stack builds on it."},
{"d":"Software Dev","q":"cuDNN's role in the stack is to provide:","o":["GPU-accelerated primitives for deep learning (convolutions, attention, etc.), called automatically by PyTorch/TensorFlow","A container registry","A vector similarity search index","A dataframe library"],"a":[0],"e":"cuDNN implements optimized low-level deep-learning operations on top of CUDA; frameworks dispatch to it transparently whenever you run a conv or attention layer on GPU."},
{"d":"Software Dev","q":"NCCL is used specifically for:","o":["Serving models as an API","Multi-GPU communication, such as syncing gradients across GPUs during distributed training","Cleaning pretraining data","Tokenizing text before training"],"a":[1],"e":"NCCL implements collective communication primitives (all-reduce, broadcast, etc.) optimized for GPU-to-GPU transfer."},
{"d":"Software Dev","q":"NeMo's core purpose is to:","o":["Serve models as a scalable API endpoint","Curate pretraining datasets only","Provide an end-to-end framework to build, customize (fine-tune), and deploy generative-AI models (LLM, speech, multimodal)","Optimize compiled engines for inference speed only"],"a":[2],"e":"NeMo is NVIDIA's training/fine-tuning framework spanning the whole model-building lifecycle, not just one narrow step like serving or data cleaning."},
{"d":"Software Dev","q":"Which NVIDIA tool is responsible for deduplication, PII filtering, and quality filtering of a pretraining corpus?","o":["TensorRT-LLM","NeMo Guardrails","NeMo Curator","Triton Inference Server"],"a":[2],"e":"NeMo Curator is the GPU-accelerated data-curation tool used before training even starts -- cleaning raw text at scale."},
{"d":"Software Dev","q":"NeMo Guardrails is used to:","o":["Wrap an LLM app with programmable safety rules (topic control, moderation, jailbreak defense) via a Colang config","Serve embeddings for RAG","Deduplicate the pretraining corpus","Compile a model into a faster inference engine"],"a":[0],"e":"Guardrails sits between the user and the LLM, enforcing rules like refusing certain topics -- a safety layer, not a speed or data-cleaning tool."},
{"d":"Software Dev","q":"NeMo Retriever provides which piece of a RAG pipeline?","o":["The safety guardrails","Embedding and retrieval microservices","The compiled inference engine","The vector database itself"],"a":[1],"e":"NeMo Retriever exposes embedding/retrieval as microservices -- the piece of RAG responsible for turning text into vectors and finding relevant chunks."},
{"d":"Software Dev","q":"Megatron(-LM) is used when:","o":["A model is too large to fit or train efficiently on one GPU, requiring tensor/pipeline model parallelism","You only need inference, not training","A model fits comfortably on a single GPU","You need a vector database"],"a":[0],"e":"Megatron provides the techniques and library support for splitting very large models across many GPUs during training -- NeMo calls into it when a model doesn't fit on one device."},
{"d":"Software Dev","q":"TensorRT's core function is:","o":["Vector similarity search","Annotating training data","Optimizing a trained model for fast GPU inference via layer/kernel fusion and precision calibration","Distributed training orchestration"],"a":[2],"e":"TensorRT is a build-time inference optimizer + runtime: it fuses operations, calibrates lower precision, and auto-tunes kernels -- same math, much faster inference."},
{"d":"Software Dev","q":"TensorRT-LLM adds which LLM-specific capabilities on top of TensorRT?","o":["A vector database","A chat UI","In-flight (continuous) batching and paged KV cache, baked into the compiled engine","Data deduplication and PII filtering"],"a":[2],"e":"TensorRT-LLM specializes TensorRT for autoregressive generation, compiling in techniques like continuous batching and paged KV cache directly."},
{"d":"Software Dev","q":"Which capabilities does Triton Inference Server provide? Pick TWO.","o":["Serving models from multiple frameworks (PyTorch, ONNX, TensorRT) concurrently","Dynamic batching of incoming requests to raise GPU utilization","Automatic labeling of training data","Curating pretraining datasets"],"a":[0,1],"e":"Triton is framework-agnostic model serving with dynamic batching and concurrent model execution over HTTP/gRPC. Labeling and data curation belong to other tools entirely."},
{"d":"Software Dev","q":"NIM (NVIDIA Inference Microservices) is best described as:","o":["Prebuilt containers bundling an optimized engine, Triton, and a standard API for one-command deployment","A data-cleaning tool","A raw GPU programming model","A GPU kernel language"],"a":[0],"e":"NIM collapses optimize (TensorRT-LLM) + serve (Triton) + API into a single container pulled from NGC, so deployment is one docker run command."},
{"d":"Software Dev","q":"RAPIDS' cuDF and cuML are GPU-accelerated drop-in replacements for which two libraries respectively?","o":["PyTorch and TensorFlow","LangChain and LlamaIndex","pandas and scikit-learn","NumPy and SciPy"],"a":[2],"e":"cuDF mirrors the pandas API for dataframes; cuML mirrors scikit-learn's API for classical ML -- both running on GPU with largely the same code."},
{"d":"Software Dev","q":"DALI's role in a training pipeline is to:","o":["Provide the vector database for RAG","Compile the model for inference","Decode and augment data (images/audio/video) on the GPU so the CPU doesn't bottleneck an expensive GPU","Serve the final trained model"],"a":[2],"e":"DALI moves data loading/augmentation work onto the GPU, keeping it fed during training instead of waiting on CPU-bound preprocessing."},
{"d":"Software Dev","q":"NGC is best described as:","o":["A vector database product","A safety/guardrails tool","A training framework","A catalog of GPU-optimized containers, pretrained models, and SDKs"],"a":[3],"e":"NGC is a shelf you pull pre-built, version-pinned assets from (containers, models, SDKs) -- not a tool that does anything itself."},
{"d":"Software Dev","q":"DGX systems are:","o":["A prompt-engineering framework","A vector similarity search index","A software optimization library","Purpose-built AI supercomputing hardware (multiple GPUs with NVLink/NVSwitch interconnect)"],"a":[3],"e":"DGX is certified hardware -- multiple GPUs sharing high-bandwidth interconnect -- the physical machine that runs the rest of the stack."},
{"d":"Software Dev","q":"NVIDIA AI Enterprise is essentially:","o":["The same NGC containers/tools bundled with enterprise support and licensing for production use","A completely different set of software than the rest of the stack","A vector database","A replacement for CUDA"],"a":[0],"e":"AI Enterprise doesn't introduce new software -- it's a support/licensing wrapper around the same validated stack (NeMo, Triton, TensorRT, etc.) for production deployments."},
{"d":"Software Dev","q":"Post-training quantization (PTQ) differs from quantization-aware training (QAT) in that:","o":["PTQ requires no calibration data at all","PTQ retrains the whole model from scratch; QAT does not train at all","QAT is always faster to apply than PTQ","PTQ calibrates quantization ranges using a small dataset after training is done; QAT simulates quantization during training so weights adapt to it"],"a":[3],"e":"PTQ is a quick post-hoc step; QAT bakes the rounding behavior into training itself, usually yielding better accuracy at the cost of more work."},
{"d":"Software Dev","q":"Mixed-precision training typically keeps an FP32 master copy of the weights and uses loss scaling in order to:","o":["Eliminate the need for gradient computation","Increase the model's parameter count","Remove the need for an optimizer","Avoid FP16 underflow while still getting the speed/memory benefits of FP16/BF16 compute on Tensor Cores"],"a":[3],"e":"FP16 has a narrow exponent range; small gradient values can underflow to zero. Loss scaling multiplies the loss before backprop (then unscales) to keep gradients representable in FP16."},
{"d":"Software Dev","q":"Knowledge distillation trains a smaller 'student' model to:","o":["Generate adversarial examples against the teacher","Mimic a larger 'teacher' model's output distribution, compressing its behavior into fewer parameters","Replace the teacher's tokenizer","Only copy the teacher's weights directly, unchanged"],"a":[1],"e":"DistilBERT and similar models train the student to match the teacher's soft output distribution, transferring much of its behavior in a smaller footprint."},
{"d":"Software Dev","q":"KV caching during autoregressive generation exists to:","o":["Cache the model's weights in a smaller format","Avoid recomputing each already-generated token's key/value vectors at every new decoding step","Replace the need for attention entirely","Store training data for later reuse"],"a":[1],"e":"Without caching, generating token N would require recomputing K/V for all N-1 prior tokens again; caching them makes each new token cost roughly constant work."},
{"d":"Software Dev","q":"Paged KV cache (used by vLLM and TensorRT-LLM) manages memory by:","o":["Deleting the KV cache after every token","Reserving one large worst-case contiguous memory block per sequence up front","Storing the KV cache on CPU only","Allocating cache memory in fixed-size blocks on demand, similar to OS virtual memory, so more sequences fit in the same GPU memory"],"a":[3],"e":"Paged KV cache avoids the waste of reserving worst-case contiguous memory per sequence, instead allocating small blocks as needed -- the same idea as virtual memory paging."},
{"d":"Software Dev","q":"Dynamic batching (Triton) and in-flight/continuous batching (TensorRT-LLM) both aim to:","o":["Reduce model accuracy for speed","Raise GPU utilization by grouping/overlapping requests, though continuous batching additionally admits new sequences without waiting for the whole batch to finish","Replace quantization","Eliminate the need for a vector database"],"a":[1],"e":"Both group work to keep the GPU busy; continuous batching goes further by admitting new requests as soon as any sequence in the batch finishes."},
{"d":"Software Dev","q":"A 175B-parameter model can't fit on a single GPU. Pick TWO techniques that split the MODEL itself across GPUs.","o":["Gradient accumulation","Data parallelism","Tensor parallelism","Pipeline parallelism"],"a":[2,3],"e":"Tensor parallelism splits individual weight matrices across GPUs; pipeline parallelism assigns groups of layers to different GPU stages. Data parallelism copies the whole model, which doesn't help if it can't fit on one GPU."},
{"d":"Software Dev","q":"Data parallelism, as a training strategy, works by:","o":["Splitting layers across GPU stages","Splitting each weight matrix across GPUs","Reducing the model to 4-bit precision","Copying the full model to every GPU and splitting the training batch across them, then syncing gradients"],"a":[3],"e":"Each GPU holds a full copy of the model and processes a different slice of the batch; gradients are then averaged/synced before the weight update."},
{"d":"Software Dev","q":"Small batch sizes at inference favor which metric, while large batches maximize the other?","o":["Small batches favor per-request latency; large batches favor throughput (tokens/sec)","Both favor latency equally","Small batches favor throughput; large batches favor latency","Neither is affected by batch size"],"a":[0],"e":"A small batch finishes any one request faster (low latency) but underuses the GPU; a large batch processes more total tokens per second (throughput) at the cost of any single request waiting longer."},
{"d":"Software Dev","q":"Time to first token (TTFT) specifically measures:","o":["How long a user waits before the very first output token appears -- the key streaming-latency metric","Total time to generate the entire response","The time spent training the model","The time to load the model into GPU memory once at startup"],"a":[0],"e":"TTFT captures perceived responsiveness in a streaming UI -- how long before anything starts appearing."},
{"d":"Software Dev","q":"Why is LLM decoding (token-by-token generation) typically memory-bandwidth-bound rather than compute-bound?","o":["Because decoding always runs on CPU","Because decoding uses no matrix multiplication","Because each step must stream essentially all the model's weights from GPU memory to produce just one token","Because attention is skipped during decoding"],"a":[2],"e":"Generating one token still requires reading the entire model's weights from HBM, but produces only one token's worth of output -- memory bandwidth, not compute, is the bottleneck."},
{"d":"Software Dev","q":"You must not confuse Triton Inference Server with 'OpenAI Triton.' What is OpenAI Triton?","o":["A GPU kernel programming language, unrelated to NVIDIA's serving product despite the shared name","A vector database","A safety guardrails framework","A model serving platform identical to NVIDIA's Triton"],"a":[0],"e":"OpenAI Triton is a language/compiler for writing custom GPU kernels -- a completely different product from NVIDIA's Triton Inference Server, which serves models as an API."},
{"d":"Software Dev","q":"'Deploy a model as a scalable API endpoint' most directly points to which NVIDIA product(s)?","o":["DALI","NeMo Curator","Triton Inference Server or NIM","Megatron-LM"],"a":[2],"e":"Triton (bring-your-own optimized model) or NIM (prepackaged container with the API already wired up) are the serving-layer answers."},
{"d":"Experimentation","q":"In a binary classification confusion matrix, a False Positive is:","o":["An actual positive predicted as negative","An actual negative predicted as positive","An actual negative predicted as negative","An actual positive predicted as positive"],"a":[1],"e":"False Positive means the model predicted 'positive' but the true label was negative -- a false alarm."},
{"d":"Experimentation","q":"Precision is defined as:","o":["TN / (TN + FP)","TP / (TP + FN)","(TP+TN) / Total","TP / (TP + FP)"],"a":[3],"e":"Precision = TP/(TP+FP): of everything the model flagged as positive, what fraction was actually positive."},
{"d":"Experimentation","q":"Recall (sensitivity) is defined as:","o":["TN / (TN + FN)","TP / (TP + FP)","(TP+TN) / Total","TP / (TP + FN)"],"a":[3],"e":"Recall = TP/(TP+FN): of everything that was actually positive, what fraction did the model correctly catch."},
{"d":"Experimentation","q":"F1 score is:","o":["The geometric mean of accuracy and recall","The harmonic mean of precision and recall","The arithmetic mean of precision and recall","Precision minus recall"],"a":[1],"e":"F1 = 2*(precision*recall)/(precision+recall) -- the harmonic mean, which penalizes a large imbalance between precision and recall more than a simple average."},
{"d":"Experimentation","q":"A cancer-screening model must catch as many true cases as possible, even at the cost of some false alarms. You should prioritize:","o":["Recall","Specificity only","Accuracy only","Precision"],"a":[0],"e":"Missing an actual cancer case (false negative) is far costlier than a false alarm here, so recall should be prioritized over precision."},
{"d":"Experimentation","q":"A dataset is 99% negative class. A model that always predicts 'negative' achieves 99% accuracy. This illustrates why:","o":["Recall equals accuracy in this case","Accuracy is always the best metric","Accuracy can be misleading on imbalanced datasets -- precision, recall, F1, or PR-AUC are more informative","The model is state-of-the-art"],"a":[2],"e":"A trivial always-negative classifier scores high accuracy while being useless at detecting the minority class -- a classic argument for using precision/recall/F1 on imbalanced data."},
{"d":"Experimentation","q":"The ROC curve plots:","o":["BLEU vs. ROUGE","True positive rate vs. false positive rate at every threshold","Loss vs. epoch","Precision vs. recall at every threshold"],"a":[1],"e":"ROC plots TPR against FPR across classification thresholds; the area under it (AUC) summarizes ranking quality independent of a chosen threshold."},
{"d":"Experimentation","q":"BLEU is a metric primarily used for:","o":["Measuring model perplexity","Summarization, and is recall-oriented","Measuring GPU utilization","Machine translation, and is precision-oriented (n-gram overlap with reference text)"],"a":[3],"e":"BLEU scores n-gram precision between generated and reference translations -- how much of the generated text's n-grams appear in the reference."},
{"d":"Experimentation","q":"ROUGE is a metric primarily used for:","o":["Machine translation, precision-oriented","Vector search accuracy","GPU memory profiling","Summarization, and is recall-oriented (how much of the reference's n-grams are covered)"],"a":[3],"e":"ROUGE measures how much of the reference summary's content is captured by the generated summary -- recall-oriented, unlike BLEU."},
{"d":"Experimentation","q":"Perplexity, as a language-model metric, means:","o":["It measures translation quality specifically","Lower perplexity means the model assigns higher probability to the actual text -- better predictive fit","It is only used for image models","Higher perplexity always means a better model"],"a":[1],"e":"Perplexity is roughly 'how surprised the model is by the true next token, on average' -- lower means the model's probability distribution matched the real text more closely."},
{"d":"Experimentation","q":"BERTScore improves on BLEU/ROUGE mainly by:","o":["Requiring no reference text at all","Measuring only sentence length","Counting exact word matches only, ignoring meaning","Comparing contextual embeddings of generated and reference text, capturing semantic similarity beyond exact n-gram overlap"],"a":[3],"e":"BERTScore uses contextual embeddings to match semantically similar (not just identical) words/phrases, catching paraphrases that BLEU/ROUGE would penalize."},
{"d":"Experimentation","q":"Of all hyperparameters, which is generally considered to have the single highest impact on training outcomes?","o":["Batch size","Vocabulary size","Number of attention heads","Learning rate"],"a":[3],"e":"Learning rate controls the step size of every weight update; too high causes divergence/NaN, too low wastes compute -- usually the first hyperparameter tuned."},
{"d":"Experimentation","q":"Training loss goes to NaN a few hundred steps into fine-tuning. The most likely first fix is:","o":["Switch to a larger batch size only","Remove the validation set","Increase the learning rate further","Lower the learning rate and/or add warmup and gradient clipping"],"a":[3],"e":"NaN/divergent loss is the classic signature of too-high a learning rate; lowering it (plus warmup and gradient clipping) is the standard first response."},
{"d":"Experimentation","q":"Increasing batch size generally has which effect, at the cost of more memory?","o":["No effect on gradient estimates","Guaranteed faster convergence in fewer total steps regardless of learning rate","Stabler gradient estimates and better GPU utilization","Noisier, less stable gradient estimates"],"a":[2],"e":"Averaging the gradient over more examples reduces its variance and better saturates GPU parallelism, though it uses more memory and may need a learning-rate adjustment."},
{"d":"Experimentation","q":"Early stopping, combined with tracking epochs, is used to:","o":["Guarantee the lowest possible training loss","Replace the need for a validation set","Increase the model's parameter count automatically","Stop training once validation loss stops improving, preventing overfitting from training too long"],"a":[3],"e":"Early stopping halts training at the point where validation performance peaks, before the model starts overfitting to the training set."},
{"d":"Experimentation","q":"Grid search for hyperparameter tuning works by:","o":["Randomly sampling combinations from the search space","Using a probabilistic model to choose the next point to evaluate","Only tuning one hyperparameter at a time, ignoring interactions","Exhaustively evaluating every combination on a predefined grid of values"],"a":[3],"e":"Grid search tries every combination across a fixed grid -- thorough but combinatorially expensive as the number of hyperparameters grows."},
{"d":"Experimentation","q":"Random search for hyperparameter tuning, compared to grid search, tends to:","o":["Often find good configurations more efficiently, since it doesn't waste evaluations on unimportant dimensions of the grid","Guarantee the global optimum","Require a probabilistic surrogate model","Always perform worse with the same compute budget"],"a":[0],"e":"Random search samples randomly rather than exhaustively, which in practice often finds good hyperparameters faster than grid search, especially when only a few hyperparameters actually matter."},
{"d":"Experimentation","q":"Bayesian optimization for hyperparameter tuning works by:","o":["Always choosing hyperparameters at random","Building a probabilistic surrogate model of the objective and using it to choose the most promising next configuration to try","Trying every possible combination exhaustively","Ignoring past evaluation results entirely"],"a":[1],"e":"Bayesian optimization uses prior evaluation results to model where the objective is likely best, focusing future trials there -- more sample-efficient than grid/random search."},
{"d":"Experimentation","q":"A/B testing in ML deployment is used to:","o":["Measure GPU utilization only","Replace the need for a validation set","Compare model architectures purely offline before any live traffic","Compare two live variants (e.g. model versions) on real user traffic to see which performs better on a target metric"],"a":[3],"e":"A/B tests split live traffic between variants to measure real-world impact on a business/product metric, complementing offline evaluation."},
{"d":"Experimentation","q":"A p-value in an A/B test result tells you:","o":["The probability of observing a difference at least this extreme if there were truly no effect (the null hypothesis)","The probability the new variant is better","The sample size needed","The exact magnitude of the improvement"],"a":[0],"e":"A small p-value means the observed difference would be unlikely under the null hypothesis -- it's evidence against the null, not a direct probability that the variant is better."},
{"d":"Experimentation","q":"An ablation study is used to:","o":["Tune the learning rate schedule only","Increase the model's parameter count","Test the model on adversarial inputs only","Remove or vary one component of a system at a time to measure its individual contribution to performance"],"a":[3],"e":"Ablations isolate the effect of a specific design choice by comparing performance with and without it, holding everything else constant."},
{"d":"Experimentation","q":"Data leakage occurs when:","o":["The learning rate is too high","Information from outside the training set (often from the test/validation set) improperly influences training, inflating reported performance","The model is trained on too little data","The batch size is too small"],"a":[1],"e":"Leakage lets the model 'see' information it shouldn't, making evaluation optimistic and unreliable."},
{"d":"Experimentation","q":"Which scenario is a classic example of data leakage?","o":["Splitting data into train/val/test before any preprocessing","Computing normalization statistics (mean/std) using the full dataset, including test data, before splitting","Applying dropout during training only","Using early stopping on a validation set"],"a":[1],"e":"If normalization statistics are computed from the full dataset (including test data) before splitting, information from the test set leaks into training preprocessing."},
{"d":"Experimentation","q":"K-fold cross-validation is used primarily to:","o":["Get a more robust estimate of model performance by training/evaluating across multiple different train/validation splits","Speed up training by using less data","Replace the test set entirely","Increase the size of the training set permanently"],"a":[0],"e":"K-fold CV rotates which portion of the data is held out for validation across k folds, averaging results for a less noisy performance estimate than a single split."},
{"d":"Experimentation","q":"On a loss-vs-epoch plot, training loss keeps decreasing while validation loss decreases then turns upward. The turning point marks:","o":["A sign of data leakage","A sign of underfitting","The ideal point to increase the learning rate","Roughly where early stopping should occur, before overfitting worsens"],"a":[3],"e":"That inflection point is exactly where the model has stopped generalizing better and started memorizing training-specific noise."},
{"d":"Experimentation","q":"On a loss-vs-epoch plot, both training and validation loss plateau at a high value together. This is most consistent with:","o":["Successful convergence to optimal performance","Overfitting","Data leakage","Underfitting (high bias)"],"a":[3],"e":"Both curves being high and close together (not diverging) suggests the model lacks capacity or training time to fit the data well -- underfitting."},
{"d":"Experimentation","q":"For multi-class classification with imbalanced classes, macro-F1 differs from micro-F1 in that:","o":["Macro-F1 only applies to binary classification","Macro-F1 weights every class equally regardless of its size; micro-F1 aggregates all predictions before computing one overall score, weighting by frequency","Micro-F1 ignores false positives","They are mathematically identical"],"a":[1],"e":"Macro-F1 averages per-class F1 scores equally, so a rare class counts as much as a common one; micro-F1 pools all TP/FP/FN globally, so common classes dominate."},
{"d":"Experimentation","q":"For a highly imbalanced classification problem, which is generally more informative than a plain ROC curve?","o":["A t-SNE plot","A loss-vs-epoch plot","A precision-recall curve","A learning-rate schedule chart"],"a":[2],"e":"ROC/AUC can look overly optimistic on heavily imbalanced data because the false-positive-rate denominator (negatives) is huge; precision-recall curves are more sensitive to the rare positive class."},
{"d":"Experimentation","q":"The key distinction between a 'loss' and an 'evaluation metric' is:","o":["Loss is optimized directly by gradient descent and must be differentiable; a metric (e.g. accuracy, BLEU) evaluates quality and need not be differentiable","They are always the same function","Metrics are only used during training, never at evaluation","Loss is only used for classification, metrics only for regression"],"a":[0],"e":"You need a smooth, differentiable loss to compute gradients, but you often report a more interpretable, possibly non-differentiable metric to judge real-world quality."},
{"d":"Experimentation","q":"A validation set and a test set serve different purposes because:","o":["The test set is used during training to compute gradients","The validation set must always be larger than the test set","The validation set guides hyperparameter/model selection during development; the test set gives one final, untouched estimate of generalization","They are interchangeable and either can be used for either purpose"],"a":[2],"e":"Repeatedly checking performance on the validation set to make decisions is fine, but doing the same on the test set would leak information and inflate the final reported number."},
{"d":"Experimentation","q":"Statistical significance in an A/B test (a low p-value) does NOT automatically guarantee:","o":["That the difference is real and repeatable","That a hypothesis test was run","That a null hypothesis was defined","That the difference is practically/economically meaningful in size"],"a":[3],"e":"A tiny, statistically significant improvement may not be worth the engineering cost to ship -- statistical significance and practical significance are different questions."},
{"d":"Experimentation","q":"Running many A/B test variants and metrics simultaneously without correction increases the risk of:","o":["Underfitting the production model","Vanishing gradients","False positives from the multiple-comparisons problem -- some 'significant' results are just noise","Data leakage in the training set"],"a":[2],"e":"Testing enough metrics/variants at once means some will appear 'significant' by chance alone; correction methods or pre-registering a primary metric help control this."},
{"d":"Experimentation","q":"Fixing a random seed across experiment runs is important mainly for:","o":["Reproducibility -- isolating whether a change in results came from your actual change or just random variation","Reducing GPU memory usage","Guaranteeing the best possible hyperparameters","Making the model train faster"],"a":[0],"e":"Without a fixed seed, two runs of the 'same' experiment can differ just from random initialization/shuffling, making it hard to attribute a performance change to your actual intervention."},
{"d":"Experimentation","q":"Establishing a simple baseline model before building something complex is valuable because:","o":["It gives a reference point to judge whether added complexity is actually earning its keep","Baselines require no evaluation metric","Baselines eliminate the need for a test set","Baselines are always the best final choice"],"a":[0],"e":"Without a baseline, you can't tell if a complex model's performance is genuinely good or just 'good for this problem.'"},
{"d":"Experimentation","q":"For a fraud-detection model with 0.1% positive class, accuracy is a poor headline metric mainly because:","o":["Accuracy requires a validation set that doesn't exist","A model predicting 'no fraud' for everything scores 99.9% accuracy while catching zero real fraud","Accuracy cannot be computed for binary classification","Accuracy only applies to regression"],"a":[1],"e":"On extreme imbalance, accuracy is dominated by the majority class and hides complete failure on the minority class."},
{"d":"Experimentation","q":"Comparing automatic metrics (BLEU/ROUGE) to human evaluation for generative text quality, the key tradeoff is:","o":["Automatic metrics are fast/cheap/reproducible but miss fluency, factuality, and nuance that human judgment captures better","Human evaluation can be fully automated","Automatic metrics are always more accurate than humans","Automatic metrics require no reference text at all times"],"a":[0],"e":"BLEU/ROUGE are cheap to compute at scale but only measure surface overlap; human evaluation is expensive and slower but judges coherence, correctness, and helpfulness directly."},
{"d":"Experimentation","q":"When tuning hyperparameters, which of the following correctly separates the roles of validation and test sets?","o":["Pick the winning configuration by test performance, then report validation performance","Use only the training set for everything","Use only the test set for everything","Pick the winning configuration by validation performance, then report the final number on the untouched test set"],"a":[3],"e":"This ordering avoids ever using the test set to make decisions -- it stays untouched until the very end, giving an honest estimate of generalization."},
{"d":"Experimentation","q":"A model shows 98% training accuracy but only 71% validation accuracy, and validation accuracy is falling. Pick TWO appropriate responses.","o":["Add dropout or weight-decay regularization","Train for many more epochs with no other changes","Use early stopping based on validation loss","Remove the validation split to free up more training data"],"a":[0,2],"e":"This is overfitting: regularize and stop early. Training longer unchanged worsens it, and removing the validation split would blind you to exactly this problem."},
{"d":"Experimentation","q":"Pick TWO metrics that are recall-oriented or precision-oriented by design (one each).","o":["BLEU is precision-oriented","F1 is purely precision-oriented","Perplexity is recall-oriented","ROUGE is recall-oriented"],"a":[0,3],"e":"ROUGE measures how much reference content is recovered (recall); BLEU measures how much generated content matches the reference (precision). Perplexity isn't a precision/recall metric, and F1 blends both."},
{"d":"Experimentation","q":"Which pairing correctly matches a diagnosis to its typical loss-curve pattern? Pick TWO.","o":["Underfitting: validation loss falls while train loss rises","Overfitting: train loss keeps falling, validation loss rises","Overfitting: both train and validation loss stay identically low","Underfitting: both train and validation loss stay high and close together"],"a":[1,3],"e":"Overfitting shows a widening train/validation gap; underfitting shows both curves plateauing high together."},
{"d":"Experimentation","q":"A model's validation performance is measured using k different random train/validation splits averaged together. This describes:","o":["Data leakage","K-fold cross-validation","Grid search","A/B testing"],"a":[1],"e":"Averaging performance across k different splits of the same dataset is exactly k-fold cross-validation, used to reduce the variance of a single-split estimate."},
{"d":"Experimentation","q":"Why should the primary success metric for an A/B test be chosen and locked in before the experiment starts?","o":["To prevent cherry-picking a metric that happened to look favorable after the fact (a form of p-hacking)","To make the analysis code simpler only","Because only one metric can ever be computed per experiment","Because metrics cannot be changed in code afterward"],"a":[0],"e":"Choosing the metric after seeing results (or scanning many metrics for a favorable one) inflates the chance of a false positive -- pre-registering the primary metric guards against this."},
{"d":"Experimentation","q":"Guardrail (secondary) metrics in an A/B test exist to:","o":["Catch unintended harm (e.g. latency regressions, error rates) even if the primary metric improves","Replace the primary success metric","Increase statistical power automatically","Eliminate the need for a control group"],"a":[0],"e":"A variant might win on the primary metric while quietly hurting something else; guardrail metrics are watched specifically to catch that kind of collateral damage."},
{"d":"Experimentation","q":"Pick TWO valid reasons an ablation study might show a component (e.g. residual connections) contributes little to a specific benchmark.","o":["Removing any component always improves performance","Ablation studies never produce a null result","The component's benefit only appears at a scale or depth the ablation didn't test","The benchmark doesn't stress the failure mode that component addresses (e.g. it's not deep enough to need it)"],"a":[2,3],"e":"A component can be genuinely important in general while showing little effect in one particular ablation setup that doesn't exercise the scenario it helps with."},
{"d":"Data Analysis","q":"NeMo Curator's exact deduplication step is used to:","o":["Rerank retrieved documents","Add more synthetic data to the corpus","Remove identical or near-identical documents from a pretraining corpus before training","Compress the model's weights"],"a":[2],"e":"Removing exact/near duplicates prevents the model from over-weighting repeated content and wasting compute re-training on the same text."},
{"d":"Data Analysis","q":"Fuzzy (near-duplicate) deduplication differs from exact deduplication in that it:","o":["Only removes byte-for-byte identical documents","Catches documents that are highly similar but not byte-identical, often via techniques like MinHash/LSH","Requires manual human review of every document","Is only applicable to images, not text"],"a":[1],"e":"Fuzzy dedup uses similarity-based hashing to catch near-duplicates that exact hash matching would miss -- common in web-scraped corpora full of mirrored or lightly-edited pages."},
{"d":"Data Analysis","q":"PII filtering in a data curation pipeline is meant to:","o":["Remove personally identifiable information before it enters a training corpus","Increase the vocabulary size","Rank documents by embedding similarity","Balance class labels in a classification dataset"],"a":[0],"e":"Filtering PII (names, emails, ID numbers, etc.) out of training data reduces the risk of the model memorizing and later regurgitating sensitive personal information."},
{"d":"Data Analysis","q":"Quality/heuristic filtering of a pretraining corpus primarily improves:","o":["GPU utilization only","The vector database's index speed","The tokenizer's vocabulary size","The signal-to-noise ratio of what the model actually learns from, often more than adding more raw unfiltered data would"],"a":[3],"e":"Training on cleaner data tends to matter more than training on more unfiltered data -- quality filtering is a major lever in modern pretraining pipelines."},
{"d":"Data Analysis","q":"Stemming reduces a word to its root form by:","o":["Translating the word into another language","Embedding the word into a vector space","Crudely chopping off common suffixes using fixed rules, which can produce non-words","Consulting a dictionary to find the word's true grammatical lemma"],"a":[2],"e":"Stemming (e.g. Porter stemmer) applies simple suffix-stripping rules without understanding grammar, sometimes producing invalid words."},
{"d":"Data Analysis","q":"Lemmatization differs from stemming in that it:","o":["Cannot be used in NLP pipelines","Only works on nouns","Is faster but less accurate than stemming","Uses vocabulary and grammatical analysis to return the dictionary base form (lemma) of a word"],"a":[3],"e":"Lemmatization considers part of speech and a lexicon to find the true dictionary form, producing linguistically valid words -- unlike stemming's cruder rule-based chopping."},
{"d":"Data Analysis","q":"SMOTE (Synthetic Minority Oversampling Technique) addresses class imbalance by:","o":["Generating synthetic minority-class examples by interpolating between existing minority samples","Deleting majority-class examples at random","Changing the loss function to MSE","Increasing the learning rate for minority-class batches"],"a":[0],"e":"SMOTE creates new synthetic minority-class points along the line between real minority samples and their neighbors."},
{"d":"Data Analysis","q":"Class weighting as an imbalance-handling technique works by:","o":["Changing the train/test split ratio","Removing majority-class samples from the dataset","Assigning a higher loss penalty to misclassifying the minority class, without changing the dataset itself","Duplicating minority-class rows physically in storage"],"a":[2],"e":"Class weights scale the loss contribution of each class, telling the optimizer minority-class mistakes cost more, without touching the actual data distribution."},
{"d":"Data Analysis","q":"Undersampling and oversampling are two opposite strategies for imbalance that respectively:","o":["Undersampling duplicates minority examples; oversampling removes majority examples","Neither changes the class distribution","Undersampling removes majority-class examples; oversampling duplicates/generates minority-class examples","Both add synthetic data only"],"a":[2],"e":"Undersampling shrinks the majority class down toward the minority's size; oversampling grows the minority class up toward the majority's size."},
{"d":"Data Analysis","q":"t-SNE is primarily used to:","o":["Train a classifier directly","Clean text data of PII","Compute BLEU scores","Visualize high-dimensional data (e.g. embeddings) in 2D/3D by preserving local neighborhood structure"],"a":[3],"e":"t-SNE is a non-linear dimensionality-reduction technique built for visualization, emphasizing preservation of local neighbor relationships."},
{"d":"Data Analysis","q":"UMAP, compared to t-SNE, is generally chosen when you want:","o":["Similar neighborhood-preserving visualization, often faster and better at preserving some global structure too","A technique restricted to only 3 dimensions","A technique that cannot handle large datasets","A supervised classification algorithm"],"a":[0],"e":"UMAP is often faster than t-SNE on large datasets and tends to preserve more of the global structure alongside local neighborhoods."},
{"d":"Data Analysis","q":"Unlike t-SNE/UMAP, PCA reduces dimensionality by:","o":["Clustering points into discrete groups","Finding linear directions (principal components) of maximum variance in the data","Finding a non-linear embedding that preserves local neighbors","Randomly dropping features"],"a":[1],"e":"PCA is a linear technique that projects data onto the orthogonal directions capturing the most variance -- it can miss non-linear structure that t-SNE/UMAP capture."},
{"d":"Data Analysis","q":"cuDF accelerates which kind of workload?","o":["Vector similarity search","LLM inference serving","Pandas-style dataframe operations (groupby, joins, filtering) on GPU","Deep learning training exclusively"],"a":[2],"e":"cuDF is RAPIDS' GPU-accelerated dataframe library, mirroring pandas' API so existing dataframe code can often run largely unchanged, just much faster."},
{"d":"Data Analysis","q":"cuML provides GPU-accelerated implementations mirroring which library's API?","o":["PyTorch","scikit-learn","Hugging Face Transformers","TensorFlow"],"a":[1],"e":"cuML implements classical ML algorithms with a scikit-learn-compatible API, running on GPU."},
{"d":"Data Analysis","q":"cuGraph, part of RAPIDS, is specialized for:","o":["Vector embedding generation","GPU-accelerated graph analytics (e.g. PageRank, community detection)","Image augmentation","Dataframe manipulation"],"a":[1],"e":"cuGraph accelerates graph algorithms on GPU, complementing cuDF (dataframes) and cuML (classical ML) in the RAPIDS suite."},
{"d":"Data Analysis","q":"To show how a single metric changes continuously over time, the best chart choice is generally:","o":["A line chart","A pie chart","A scatter plot with no time axis","A bar chart for each individual day with no ordering"],"a":[0],"e":"Line charts are built for showing trends over an ordered continuous axis like time; pie charts show proportions of a whole at one moment, not trends."},
{"d":"Data Analysis","q":"To compare a single numeric value across several discrete categories, the best chart choice is generally:","o":["A bar chart","A line chart","A confusion matrix","A t-SNE plot"],"a":[0],"e":"Bar charts are ideal for comparing magnitudes across distinct categories; line charts imply a continuous, ordered progression which categories usually don't have."},
{"d":"Data Analysis","q":"To examine the relationship between two continuous numeric variables, the best chart choice is generally:","o":["A word cloud","A scatter plot","A pie chart","A stacked bar chart"],"a":[1],"e":"Scatter plots directly show how two continuous variables co-vary, revealing correlation, clusters, or outliers."},
{"d":"Data Analysis","q":"To visualize the pairwise correlation between many numeric features at once, the standard chart is:","o":["A line chart","A heatmap (correlation matrix)","A box plot","A pie chart"],"a":[1],"e":"A heatmap with color-coded cells is the standard way to scan a full correlation matrix at a glance across many feature pairs simultaneously."},
{"d":"Data Analysis","q":"To visualize a numeric variable's median, quartiles, and outliers at a glance, the standard chart is:","o":["A network graph","A pie chart","A box plot","A word cloud"],"a":[2],"e":"Box plots summarize the five-number summary (min, Q1, median, Q3, max) and flag outliers beyond the whiskers."},
{"d":"Data Analysis","q":"Which visualization is most directly useful for spotting outliers in a single numeric feature?","o":["A confusion matrix","A box plot or scatter plot","A word cloud","A pie chart"],"a":[1],"e":"Box plots explicitly flag points beyond the whiskers as outliers; scatter plots also make visually distant points easy to spot."},
